<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<meta name="theme-color" content="#0d5d70" />
<title>Railopoly｜台灣鐵路環島大富翁</title>
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Railopoly">
<link rel="stylesheet" href="./styles.css">
</head>
<body>
<div class="app">
<header class="hero"><div class="brand"><div class="logo">🚂</div><div><h1>Railopoly</h1><p class="subtitle">台灣鐵路環島大富翁｜三天兩夜版</p></div></div></header>
<main>
<section id="home" class="page active"><div id="permissionBanner" class="permission"></div>
<div class="panel status"><div><div class="turn-label">本輪擲骰玩家</div><div id="turnName" class="turn-name">玩家 1</div><div id="gameMode" class="subtitle" style="margin-top:4px"></div></div><button class="mini" onclick="nextTurn()">換下一位 →</button></div>
<div class="panel status"><div><div class="turn-label">全場共用骰子</div><div id="sharedDiceCount" class="dice-count">🎲 1 顆</div></div><div id="diceAdmin"></div></div><div class="grid">
<button class="big dice" onclick="rollDice()"><span>🎲</span>擲骰子</button>
<button class="big chance" onclick="draw('chance')"><span>🍀</span>機會卡</button>
<button class="big fate" onclick="draw('fate')"><span>🌊</span>命運卡</button>
<button class="big task" onclick="draw('task')"><span>🎯</span>任務卡</button>
</div>
<div class="panel" style="margin-top:14px"><h3 class="section-title">我的機會卡</h3><div id="chanceInventory" class="inventory"></div></div><div class="panel"><h3 class="section-title">最近紀錄</h3><div id="recent" class="history"></div></div>
</section>
<section id="players" class="page"><div class="panel"><h3 class="section-title">六位玩家</h3><div id="playerList" class="players"></div></div><div class="panel"><h3 class="section-title">積分排行</h3><div id="ranking" class="rank"></div></div></section>
<section id="roles" class="page"><div id="roleTools"></div></section>
<section id="settings" class="page"><div class="panel settings"><h3 class="section-title">房間</h3><div id="roomInfo"></div><button class="secondary" style="width:100%;margin-top:10px" onclick="leaveRoom()">離開房間</button></div><div class="panel settings"><h3 class="section-title">身分與職位</h3><p class="subtitle">先選擇這支手機目前由哪位玩家使用，再為六位玩家分配六個不同職位。</p><label>這支手機的玩家</label><select id="devicePlayer" onchange="setDevicePlayer(this.value)"></select><div id="roleInputs" class="role-grid"></div></div><div class="panel settings"><h3 class="section-title">玩家名稱</h3><div id="nameInputs"></div></div><div class="panel settings"><h3 class="section-title">主持人管理</h3><div id="hostManagement"></div></div><div class="panel settings"><h3 class="section-title">遊戲管理</h3><p class="subtitle">主持人可開始或重設遊戲。資料會即時同步到 Firebase 雲端；每支手機請在上方選擇自己的玩家身分。</p><button id="startBtn" class="mini" style="width:100%;margin-top:16px;padding:12px" onclick="startOfficialGame()">正式開始三日遊戲</button><button id="resetBtn" class="danger" onclick="resetGame()">清除目前資料並回到測試模式</button></div></section>
</main>
</div>
<nav class="bottom"><button class="nav active" data-page="home" onclick="showPage('home',this)"><b>🏠</b>遊戲</button><button class="nav" data-page="players" onclick="showPage('players',this)"><b>👥</b>玩家</button><button class="nav" data-page="roles" onclick="showPage('roles',this)"><b>🧭</b>職務</button><button class="nav" data-page="settings" onclick="showPage('settings',this)"><b>⚙️</b>設定</button></nav>
<div id="roomGate" class="overlay-lock"><div class="app-entry" aria-label="Railopoly 首頁"><div class="app-entry-spacer"></div><div class="entry-actions"><button class="entry-hotspot create" aria-label="建立房間" onclick="createRoom()">🎲 建立房間</button><button class="entry-hotspot join" aria-label="加入房間" onclick="openJoinPanel()">🎟️ 加入房間</button></div></div></div><div id="joinPop" class="join-pop"><div class="join-card"><button class="join-close" onclick="closeJoinPanel()" aria-label="關閉">×</button><div class="brand"><div class="logo">🚂</div><div><h1>加入房間</h1><p class="subtitle">輸入主持人提供的 6 碼房號</p></div></div><label style="display:block;margin-top:18px">房號</label><input id="joinRoomCode" maxlength="6" placeholder="例如 A8K3P2"><button class="primary" style="width:100%;margin-top:12px" onclick="joinRoom()">加入房間</button></div></div><div id="modal" class="modal" onclick="backdrop(event)"><div id="modalBody"></div></div>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
<script src="./app.js"></script>

<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', async () => {
    try {
      const registration = await navigator.serviceWorker.register('./service-worker.js');
      registration.update();
    } catch (error) {
      console.error('Service Worker 註冊失敗：', error);
    }
  });
}
</script>
</body>
</html>
