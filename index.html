    :root {

      --muted: #637982;
      --panel: rgba(255,255,255,.92);
      --shadow: 0 18px 45px rgba(21, 71, 79, .18);
      --chance: #f6a43a;
      --chance-deep: #b65b00;
      --fate: #3c86c8;
      --fate-deep: #124f86;
      --task: #38a779;
      --task-deep: #146b4b;
      --danger: #c84b54;
    }
    * { box-sizing: border-box; }
    html, body { min-height: 100%; }
    body {
      margin: 0;
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
      background:
        radial-gradient(circle at 20% 0%, rgba(255,255,255,.92), transparent 34%),
        linear-gradient(180deg, #9edee3 0, #d7eff1 32%, var(--bg) 100%);
    }
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: .22;
      background-image:
        linear-gradient(rgba(255,255,255,.45) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.45) 1px, transparent 1px);
      background-size: 28px 28px;
      mask-image: linear-gradient(to bottom, #000, transparent 68%);
    }
    button { font: inherit; }
    .app {
      width: min(100%, 720px);
      margin: 0 auto;
      min-height: 100vh;
      padding: max(18px, env(safe-area-inset-top)) 16px max(26px, env(safe-area-inset-bottom));
      position: relative;
    }
    header { text-align: center; padding: 10px 8px 16px; }
    .eyebrow {
      display: inline-flex;
      gap: 8px;
      align-items: center;
      padding: 7px 11px;
      border-radius: 999px;
      color: #145765;
      background: rgba(255,255,255,.72);
      border: 1px solid rgba(255,255,255,.84);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: .08em;
      box-shadow: 0 5px 18px rgba(24, 88, 98, .12);

    h1 { margin: 13px 0 4px; font-size: clamp(31px, 9vw, 52px); line-height: .98; letter-spacing: -.055em; }
    .subtitle { margin: 10px auto 0; color: #396a73; line-height: 1.55; font-size: 14px; max-width: 500px; }

    .hero {
      border-radius: 28px;
      background: var(--panel);
      border: 1px solid rgba(255,255,255,.9);
      box-shadow: var(--shadow);
      overflow: hidden;
      backdrop-filter: blur(18px);
    }
    .rail-strip {
      height: 8px;
      background: repeating-linear-gradient(90deg, #17313a 0 18px, transparent 18px 27px);
      opacity: .8;
    }
    .panel { padding: 18px; }
    .deck-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }
    .deck-button {
      border: 0;
      min-height: 118px;
      border-radius: 21px;
      padding: 14px 9px;
      color: #fff;
      cursor: pointer;
      box-shadow: 0 10px 24px rgba(33, 67, 74, .16);
      transition: transform .12s ease, filter .12s ease;
      position: relative;
      overflow: hidden;
    }
    .deck-button:active { transform: scale(.97); }
    .deck-button::after {
      content: "";
      position: absolute;
      width: 75px; height: 75px;
      border-radius: 50%;
      background: rgba(255,255,255,.14);
      right: -20px; top: -22px;
    }
    .deck-button .icon { display:block; font-size: 30px; margin-bottom: 6px; }
    .deck-button strong { display:block; font-size: 17px; }
    .deck-button small { display:block; margin-top: 5px; opacity: .9; font-size: 11px; }
    .chance { background: linear-gradient(145deg, #ffbd57, var(--chance)); }
    .fate { background: linear-gradient(145deg, #62a7e3, var(--fate)); }
    .task { background: linear-gradient(145deg, #5ac99a, var(--task)); }

    .card-stage { padding: 5px 0 2px; perspective: 1200px; }
    .card {
      min-height: 350px;
      border-radius: 27px;
      padding: 22px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      color: #fff;
      box-shadow: 0 24px 48px rgba(25, 55, 64, .22);
      transform-style: preserve-3d;
      position: relative;
      overflow: hidden;
    }
    .card.animate { animation: reveal .54s cubic-bezier(.18,.78,.2,1); }
    @keyframes reveal {
      0% { transform: rotateY(90deg) scale(.82); opacity: .2; }
      100% { transform: rotateY(0) scale(1); opacity: 1; }
    }
    .card::before, .card::after {
      content: "";
      position: absolute;
      border-radius: 50%;
      background: rgba(255,255,255,.11);
    }
    .card::before { width: 180px; height:180px; right:-70px; top:-70px; }
    .card::after { width: 130px; height:130px; left:-45px; bottom:-55px; }
    .card[data-type="chance"] { background: linear-gradient(145deg, #ffba4d, #e77c17 76%); }
    .card[data-type="fate"] { background: linear-gradient(145deg, #5b9fd8, #22699d 76%); }
    .card[data-type="task"] { background: linear-gradient(145deg, #51bd8d, #21825e 76%); }
    .card.placeholder { background: linear-gradient(145deg, #1f7180, #104c5a); }
    .card-top, .card-main, .card-bottom { position: relative; z-index: 1; }
    .card-top { display:flex; align-items:center; justify-content:space-between; gap: 12px; }
    .type-label {
      border-radius: 999px;
      background: rgba(255,255,255,.17);
      border: 1px solid rgba(255,255,255,.3);
      padding: 7px 10px;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: .08em;
    }
    .card-no { font-size: 12px; opacity: .84; font-weight: 700; }
    .card-main { margin: 34px 0 28px; }
    .card-emoji { font-size: 48px; line-height: 1; }
    .card-title { font-size: clamp(28px, 8vw, 42px); line-height: 1.08; letter-spacing: -.045em; margin: 14px 0 12px; }
    .card-text { font-size: 18px; line-height: 1.65; white-space: pre-line; }
    .card-effect {
      margin-top: 18px;
      padding: 13px 14px;
      border-radius: 16px;
      background: rgba(11, 35, 42, .18);
      border: 1px solid rgba(255,255,255,.18);
      font-weight: 800;
      line-height: 1.55;
      white-space: pre-line;
    }
    .card-bottom { display:flex; justify-content:space-between; align-items:end; gap: 10px; font-size: 12px; opacity: .86; }

    .action-row { display:flex; gap:10px; margin-top: 13px; }
    .secondary {
      flex: 1;
      border: 1px solid #cadbdd;
      background: #fff;
      color: #26505a;
      padding: 13px 12px;
      border-radius: 15px;
      font-weight: 800;
      cursor: pointer;
    }
    .secondary:active { transform: scale(.98); }
    .stats {
      display:grid;
      grid-template-columns: repeat(3,1fr);
      gap: 8px;
      margin-top: 14px;
    }
    .stat {
      text-align:center;
      background: rgba(255,255,255,.7);
      border: 1px solid rgba(255,255,255,.9);
      border-radius: 16px;
      padding: 11px 6px;
      color:#355f68;
    }
    .stat b { display:block; font-size: 18px; color:#17313a; }
    .stat span { font-size: 11px; }
    details {
      margin-top: 14px;
      border-radius: 18px;
      background: rgba(255,255,255,.72);
      border: 1px solid rgba(255,255,255,.9);
      overflow: hidden;
    }
    summary { cursor: pointer; padding: 15px 16px; font-weight: 800; color:#285661; }
    .history { padding: 0 14px 14px; max-height: 240px; overflow:auto; }
    .history-item { padding: 10px 2px; border-top: 1px solid #dce8e9; font-size: 13px; display:flex; justify-content:space-between; gap:12px; }
    .history-item span:last-child { color: var(--muted); white-space: nowrap; }
    footer { text-align:center; color:#56808a; font-size: 11px; padding: 18px 8px 4px; line-height:1.6; }
    .toast {
      position: fixed;
      left: 50%; bottom: calc(24px + env(safe-area-inset-bottom));
      transform: translateX(-50%) translateY(18px);
      background: rgba(22, 48, 55, .94);
      color:#fff;
      padding: 11px 16px;
      border-radius: 999px;
      font-size: 13px;
      opacity:0;
      pointer-events:none;
      transition:.22s ease;
      z-index:50;
      white-space:nowrap;
    }
    .toast.show { opacity:1; transform: translateX(-50%) translateY(0); }
    @media (max-width: 420px) {
      .app { padding-left: 11px; padding-right: 11px; }
      .panel { padding: 13px; }
      .deck-button { min-height: 108px; border-radius: 18px; }
      .deck-button strong { font-size: 15px; }
      .card { min-height: 330px; padding: 19px; }
      .card-text { font-size: 17px; }
    }
  </style>
</head>

        </div>

        <details>

  </main>
  <div id="toast" class="toast"></div>

const labels = {chance:'機會卡', fate:'命運卡', task:'任務卡'};
const storageKey = 'railMonopolyStateV1';
let state = loadState();
let lastType = state.lastType || 'chance';

function freshState(){
  return { remaining:{chance:[],fate:[],task:[]}, used:{chance:0,fate:0,task:0}, history:[], lastType:'chance' };
}
function loadState(){
  try { return {...freshState(), ...JSON.parse(localStorage.getItem(storageKey) || '{}')}; }
  catch { return freshState(); }
}
function save(){ localStorage.setItem(storageKey, JSON.stringify(state)); }
function shuffle(arr){
  const a=[...arr];
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}
function ensureDeck(type){
  if(!Array.isArray(state.remaining[type]) || state.remaining[type].length===0){
    state.remaining[type]=shuffle(decks[type].map((_,i)=>i));
    state.used[type]=0;
    toast(`${labels[type]}已重新洗牌`);
  }
}
function draw(type){
  ensureDeck(type);
  const idx=state.remaining[type].pop();
  const item=decks[type][idx];
  state.used[type]++;
  state.lastType=type;
  lastType=type;
  state.history.unshift({type,title:item.title,time:new Date().toLocaleTimeString('zh-TW',{hour:'2-digit',minute:'2-digit'})});
  state.history=state.history.slice(0,50);
  save();
  renderCard(type,item,idx+1);
  renderStats();
  renderHistory();
}
function renderCard(type,item,no){
  const card=document.getElementById('card');
  card.classList.remove('animate','placeholder');
  void card.offsetWidth;
  card.dataset.type=type;
  card.innerHTML=`
    <div class="card-top">
      <span class="type-label">${labels[type]}</span>
      <span class="card-no">#${String(no).padStart(3,'0')}</span>
    </div>
    <div class="card-main">
      <div class="card-emoji">${item.emoji}</div>
      <h2 class="card-title">${item.title}</h2>
      <div class="card-text">${item.text}</div>
      <div class="card-effect">${item.effect}</div>
    </div>
    <div class="card-bottom"><span>抽到後立即執行</span><span>台灣鐵路環島大富翁</span></div>`;
  card.classList.add('animate');
  if(navigator.vibrate) navigator.vibrate(25);
}
function renderStats(){
  ['chance','fate','task'].forEach(type=>{
    document.getElementById(type+'Count').textContent=`${state.used[type] || 0} / ${decks[type].length}`;
  });
}
function renderHistory(){
  const box=document.getElementById('history');
  if(!state.history.length){box.innerHTML='<div class="history-item"><span>尚無紀錄</span><span>—</span></div>';return;}
  box.innerHTML=state.history.map(x=>`<div class="history-item"><span>${labels[x.type]}｜${x.title}</span><span>${x.time}</span></div>`).join('');
}
function toast(msg){
  const el=document.getElementById('toast');
  el.textContent=msg; el.classList.add('show');
  clearTimeout(toast.t); toast.t=setTimeout(()=>el.classList.remove('show'),1800);
}

document.querySelectorAll('[data-draw]').forEach(btn=>btn.addEventListener('click',()=>draw(btn.dataset.draw)));
document.getElementById('redraw').addEventListener('click',()=>draw(lastType));
document.getElementById('reset').addEventListener('click',()=>{
  if(!confirm('確定要清除所有抽牌紀錄並重新洗牌嗎？')) return;
  state=freshState(); save(); renderStats(); renderHistory(); toast('全部牌組已重新洗牌');
});
renderStats(); renderHistory();

if('serviceWorker' in navigator){ window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{})); }
</script>
