<title>Railopoly｜台灣鐵路環島大富翁</title>
<style>

*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif;color:var(--ink);background:linear-gradient(160deg,#e9f8f7,#c9e8ec 48%,#f7efe0)}button,input{font:inherit}button{cursor:pointer}.app{max-width:720px;margin:auto;min-height:100vh;padding:env(safe-area-inset-top) 16px calc(84px + env(safe-area-inset-bottom))}.hero{padding:24px 4px 14px}.brand{display:flex;align-items:center;gap:12px}.logo{width:52px;height:52px;border-radius:17px;background:var(--rail);display:grid;place-items:center;color:white;font-size:28px;box-shadow:var(--shadow)}h1{font-size:25px;line-height:1.1;margin:0}.subtitle{color:var(--muted);margin:6px 0 0;font-size:14px}.panel{background:rgba(255,255,255,.87);border:1px solid rgba(255,255,255,.7);border-radius:24px;padding:16px;box-shadow:var(--shadow);backdrop-filter:blur(12px);margin-bottom:14px}.status{display:flex;justify-content:space-between;gap:12px;align-items:center}.turn-label{font-size:13px;color:var(--muted)}.turn-name{font-weight:800;font-size:21px}.mini{border:0;border-radius:12px;padding:9px 12px;background:#edf5f4;color:var(--rail);font-weight:700}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.big{border:0;border-radius:22px;padding:20px 12px;min-height:120px;color:#17323a;font-weight:900;font-size:18px;box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;transition:.15s transform}.big:active{transform:scale(.97)}.big span{font-size:33px}.chance{background:linear-gradient(145deg,#ffd86d,var(--chance))}.fate{background:linear-gradient(145deg,#8fc2f6,var(--fate));color:#082943}.task{background:linear-gradient(145deg,#ffb39f,var(--task))}.dice{background:linear-gradient(145deg,#fff,#e7eeef)}.section-title{font-size:17px;margin:2px 0 13px}.players{display:grid;gap:10px}.player{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;background:#f7fbfa;border-radius:17px;padding:12px}.pname{font-weight:800}.stats{display:flex;gap:7px;margin-top:5px;font-size:13px;color:var(--muted)}.controls{display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end}.pill{border:0;border-radius:11px;background:white;padding:7px 9px;box-shadow:0 3px 10px rgba(0,0,0,.06);font-size:13px}.pill.money{color:#8a6410}.pill.score{color:#b04a39}.rank{display:grid;gap:8px}.rank-row{display:flex;justify-content:space-between;padding:11px 12px;border-radius:14px;background:#f7fbfa}.bottom{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:min(720px,100%);display:grid;grid-template-columns:repeat(3,1fr);padding:8px 14px calc(8px + env(safe-area-inset-bottom));background:rgba(249,252,251,.95);border-top:1px solid #d7e4e2;backdrop-filter:blur(12px);z-index:20}.nav{border:0;background:transparent;color:#6e858a;padding:7px;font-size:12px;font-weight:700}.nav.active{color:var(--rail)}.nav b{display:block;font-size:20px;margin-bottom:2px}.page{display:none}.page.active{display:block}.modal{position:fixed;inset:0;background:rgba(5,28,34,.64);display:none;align-items:center;justify-content:center;padding:20px;z-index:50}.modal.show{display:flex}.card{width:min(430px,100%);min-height:440px;border-radius:29px;background:var(--paper);padding:22px;box-shadow:0 25px 70px rgba(0,0,0,.28);display:flex;flex-direction:column;position:relative;overflow:hidden;animation:pop .3s ease}.card:before{content:"";position:absolute;inset:0 0 auto;height:12px;background:var(--accent)}@keyframes pop{from{transform:scale(.82) rotateY(30deg);opacity:0}to{transform:none;opacity:1}}.card-type{font-weight:900;color:var(--accent);letter-spacing:.12em;font-size:13px;margin-top:6px}.card-id{position:absolute;right:20px;top:24px;color:#99a7a8;font-size:12px}.card-icon{font-size:54px;margin:35px 0 10px}.card h2{font-size:27px;margin:0 0 12px}.card p{font-size:19px;line-height:1.55;white-space:pre-line;margin:0;color:#334e55}.card .note{font-size:13px;color:var(--muted);margin-top:auto;padding-top:20px}.card-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}.action{border:0;border-radius:14px;padding:13px;font-weight:800}.close{background:#edf2f2;color:#52686d}.done{background:var(--accent);color:#132d33}.dice-result{text-align:center}.die{font-size:95px;line-height:1;margin:50px 0 20px;animation:shake .55s ease}@keyframes shake{0%,100%{transform:rotate(0)}20%{transform:rotate(-16deg) scale(.9)}45%{transform:rotate(14deg) scale(1.05)}70%{transform:rotate(-8deg)}}.branch{font-weight:900;color:#b55727;background:#fff0df;border-radius:15px;padding:12px;margin-top:15px}.history{display:grid;gap:8px}.history-item{font-size:14px;background:#f7fbfa;padding:11px;border-radius:13px}.empty{text-align:center;color:var(--muted);padding:22px}.settings label{display:block;font-size:13px;color:var(--muted);margin:12px 0 6px}.settings input{width:100%;border:1px solid #cfdedd;border-radius:13px;padding:12px;background:white}.danger{background:#ffe9e9;color:#a13a42;border:0;border-radius:13px;padding:12px;font-weight:800;width:100%;margin-top:16px}@media(min-width:600px){.grid{grid-template-columns:repeat(4,1fr)}.big{min-height:145px}}

<body>
<div class="app">
<header class="hero"><div class="brand"><div class="logo">🚂</div><div><h1>Railopoly</h1><p class="subtitle">台灣鐵路環島大富翁｜三天兩夜版</p></div></div></header>
<main>
<section id="home" class="page active">
<div class="panel status"><div><div class="turn-label">本輪擲骰玩家</div><div id="turnName" class="turn-name">玩家 1</div></div><button class="mini" onclick="nextTurn()">換下一位 →</button></div>
<div class="grid">
<button class="big dice" onclick="rollDice()"><span>🎲</span>擲骰子</button>
<button class="big chance" onclick="draw('chance')"><span>🍀</span>機會卡</button>
<button class="big fate" onclick="draw('fate')"><span>🌊</span>命運卡</button>
<button class="big task" onclick="draw('task')"><span>🎯</span>任務卡</button>
</div>
<div class="panel" style="margin-top:14px"><h3 class="section-title">最近紀錄</h3><div id="recent" class="history"></div></div>
</section>
<section id="players" class="page"><div class="panel"><h3 class="section-title">六位玩家</h3><div id="playerList" class="players"></div></div><div class="panel"><h3 class="section-title">積分排行</h3><div id="ranking" class="rank"></div></div></section>
<section id="settings" class="page"><div class="panel settings"><h3 class="section-title">遊戲設定</h3><p class="subtitle">資料只儲存在這支手機的瀏覽器裡。</p><div id="nameInputs"></div><button class="danger" onclick="resetGame()">清除紀錄並重新開始</button></div></section>
</main>
</div>
<nav class="bottom"><button class="nav active" data-page="home" onclick="showPage('home',this)"><b>🏠</b>遊戲</button><button class="nav" data-page="players" onclick="showPage('players',this)"><b>👥</b>玩家</button><button class="nav" data-page="settings" onclick="showPage('settings',this)"><b>⚙️</b>設定</button></nav>
<div id="modal" class="modal" onclick="backdrop(event)"><div id="modalBody"></div></div>
<script>
const cards={
chance:[
["準點之神","今天的列車完美準點。立即獲得 200 遊戲幣。","🚆"],["幸運靠窗座","下一次擲骰可以重骰一次，並選擇較好的結果。","🪟"],["在地人報路","向一位路人問一個附近推薦；完成後積分 +20。","🗣️"],["旅途小確幸","獲得 100 遊戲幣。","✨"],["免費通行券","下一次通過他人領地時免付一次過路費。","🎫"],["神級取景","立即拍一張最有旅行感的照片；完成後積分 +20。","📸"],["車站限定款","找到任何有車站名稱的物品並拍照；完成後獲得 100 遊戲幣。","🏷️"],["好心店家","店家熱情招待，獲得 200 遊戲幣。","🤝"],["最佳旅伴","指定一位玩家，你們各獲得 100 遊戲幣。","🫶"],["一路綠燈","下一次骰子點數 +1，最高仍為 6。","🚦"],["環島能量補給","全體一起喝一口水；抽卡者積分 +10。","💧"],["旅遊之神眷顧","再抽一張機會卡。","🌟"],["今日攝影師","替其他五位玩家拍一張合照；完成後積分 +20。","📷"],["名產試吃運","找到免費試吃或與朋友分享一口食物；獲得 100 遊戲幣。","🍡"],["完美轉乘","可以立刻再擲一次骰子。","🔁"],["旅途情報王","說出下一站的一項特色；說得出來獲得 100 遊戲幣。","🧠"],["意外中獎","獲得 300 遊戲幣。","🎉"],["交換好運","與任一玩家交換手上的 100 遊戲幣。若其中一方沒有則不執行。","🔄"],["支線邀請函","本次若經過支線入口，可直接選擇進入支線。","🌿"],["鐵道迷認證","拍到一張列車、月台或鐵軌照片；積分 +20。","🚉"],["省錢達人","下一次需要支付遊戲幣時減免 100。","🐷"],["車長特別照顧","選擇：獲得 200 遊戲幣，或積分 +20。","🧑‍✈️"],["旅行好天氣","所有人一起做晴天姿勢合照；抽卡者積分 +20。","☀️"],["神秘紅包","從其他五位玩家中擲骰決定一人，向他收取 100 遊戲幣。","🧧"]],
fate:[
["珍珠奶茶癮發作","忍不住買飲料，支付 100 遊戲幣。","🧋"],["手機快沒電","為行動電源付費，支付 100 遊戲幣。","🔋"],["買太多伴手禮","支付 200 遊戲幣。","🛍️"],["睡過頭驚魂","下一次骰子點數 -1，最低仍為 1。","😴"],["臨時換月台","下一位玩家先擲骰，你延後到他的下一位。","🏃"],["人潮爆滿","本次不得重骰。","👥"],["下雨啦","全體用最狼狽的表情自拍；完成後抽卡者免除損失，否則支付 100。","🌧️"],["錢包虛驚","支付 100 遊戲幣，慶祝失而復得。","👛"],["行李太重","支付 100 遊戲幣請人協助。","🧳"],["美食踩雷","支付 100 遊戲幣，但把踩雷表情拍下來可積分 +10。","😵"],["錯過轉乘","下一次不能使用任何重骰效果。","⌛"],["旅伴迷路","指定一位玩家，你們兩人各支付 100 遊戲幣。","🗺️"],["突然想上廁所","下一位玩家先進行；之後恢復原順序。","🚻"],["車廂太冷","全體擺出冷到發抖的姿勢；最後完成的人支付 100。","🥶"],["烈日曝曬","買防曬與飲料，支付 200 遊戲幣。","🥵"],["名店大排隊","選擇支付 100 遊戲幣離開，或原地等大家數 20 秒後積分 +10。","🍜"],["站名口誤","立刻清楚念出目前車站全名三次；失敗支付 100。","😬"],["計畫趕不上變化","與積分最高的玩家交換 100 遊戲幣。","🌪️"],["虛驚一場","以為坐過站，幸好沒有。什麼事都沒發生。","😮‍💨"],["車掌廣播","模仿一次列車進站廣播。全體認可則積分 +10，否則支付 100。","📢"],["忘記帶東西","支付 100 遊戲幣購買替代品。","🤦"],["照片糊掉","立即重拍一張全體照；完成後無事，拒絕則支付 100。","🫨"],["雨傘開花","支付 200 遊戲幣更換雨具。","☂️"],["意外好運","命運突然轉彎：獲得 200 遊戲幣。","🍀"]],
task:[
["在地舌尖","找出並吃掉一種該縣市或該站限定的傳統小吃、名產。","🍜"],["方言大挑戰","找一位當地居民，教你們一句當地台語或客家話俗語並錄影。","🗣️"],["古時記憶｜特別任務","尋找古蹟、老街或地標，拍一張復古風格照。","🏛️"],["冷知識獵人","向站務員或路人詢問一個當地地名的隱藏歷史或小故事，再傳話到最後一位玩家。","🕵️"],["人情味大考驗","請一位素不相識的路人拿著你們的道具合照。","🤝"],["特產尋寶｜特別任務","用最多新台幣 50 元，買到最有當地特色且最神奇的小禮物。","🎁"],["在地人推薦","全程不能查手機，只能靠問路人，去吃路人推薦的在地美食。","🥢"],["絕景視角","拍出最具文青或底片感的車站月台、鐵道照片。","🎞️"],["熱情互助","幫一位路人完成一件小善事；以不打擾或造成壓力為原則。","💛"],["靈魂畫手｜特別任務","畫出該站代表性地標，並讓三個人猜對；不便詢問路人時可由另一組猜。","🎨"],["極速購物｜特別任務","在限定時間內，買到指定顏色的三種東西。","🛒"],["街頭好聲音","在車站外合適處，六人一起唱一句車站或火車相關歌曲。","🎤"],["地名創意聯想","用該車站地名造一個諧音梗，錄一段搞笑短影音。","🤣"],["綠意尋蹤","找到附近看起來年紀最大的樹，保持愛護距離合照。","🌳"],["老字號尋寶｜特別任務","找到一家自稱或有資料顯示開業超過 30 年的店，進行小額消費。","🏪"],["體能大挑戰","一起在車站外安全空曠處跳躍，拍出全員同時懸空照片。","🤸"],["地方特搜","找到車站內或門口標示的里程數或設站年份並拍照。","🔎"],["神秘交換｜特別任務","用一個隨身小物品，經對方同意後與人進行一次等值交換。","🔄"],["極限影子畫","用陽光與影子，在地面排出火車或車站的形狀並拍照。","🌤️"],["運氣大考驗｜特別任務","買一顆茶葉蛋，若剝開完整漂亮即可過關。","🥚"],["尋找歷史烙印","找到標有民國或西元年份，且比所有成員年紀大的建築或物件。","📅"],["千禧年姿勢","全組用 2000 年代流行姿勢在車站門口拍照。","✌️"],["神速排隊學｜特別任務","找到附近需要排隊的店或攤位，買到一樣東西並拍照；排隊超過 10 分鐘可換店。","⏱️"],["色彩尋寶獵人｜特別任務","在車站周邊拍到紅、黃、藍、綠、紫五種顏色的物品。","🌈"],["尋找同名字號｜特別任務","找到路標、店名或告示牌，包含任一隊員名字中的一個字。","🔤"],["鐵道詩人","一人一句，共同創作四句關於這座車站的短詩並朗誦。","📝"],["人體時鐘｜特別任務","不能看手機或手錶，憑感覺倒數 60 秒，誤差在 3 秒內。","⏰"],["在地視角尋寶｜特別任務","拍下水溝蓋、變電箱、招牌上印有當地名稱或圖騰的內容；三種都需完成。","🧭"],["極致節儉戰","用不超過新台幣 20 元買到可食用的東西，由全員分享。","🪙"],["時空模仿秀｜特別任務","找到當地舊海報或宣傳文宣，全組模仿其動作與表情拍照。","🎭"],["路人真心話","禮貌詢問路人：你覺得我們這組誰看起來最像什麼角色？並錄下答案。","🎙️"],["鐵道大舞廳","在車站外合適空曠處，六人做一段 15 秒無聲舞蹈或默劇，不能笑場。","💃"]]
};
const initialPlayers=Array.from({length:6},(_,i)=>({name:`玩家 ${i+1}`,money:5000,score:0}));
let state=JSON.parse(localStorage.getItem('railopolyState')||'null')||{players:initialPlayers,turn:0,decks:{},history:[]};
function save(){localStorage.setItem('railopolyState',JSON.stringify(state));render()}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function ensureDeck(type){if(!state.decks[type]||!state.decks[type].length)state.decks[type]=shuffle(cards[type].map((_,i)=>i))}
function draw(type){ensureDeck(type);const idx=state.decks[type].pop(),c=cards[type][idx];state.history.unshift({time:new Date().toLocaleTimeString('zh-TW',{hour:'2-digit',minute:'2-digit'}),kind:type,title:c[0],player:state.players[state.turn].name});state.history=state.history.slice(0,50);save();showCard(type,c,idx+1)}
function showCard(type,c,id){const names={chance:'機會卡',fate:'命運卡',task:'任務卡'},colors={chance:'var(--chance)',fate:'var(--fate)',task:'var(--task)'};modalBody.innerHTML=`<div class="card" style="--accent:${colors[type]}"><div class="card-type">${names[type]}</div><div class="card-id">#${String(id).padStart(3,'0')}</div><div class="card-icon">${c[2]}</div><h2>${c[0]}</h2><p>${c[1]}</p><div class="note">由本輪擲骰玩家立即執行；需要存證的任務請拍照或錄影。</div><div class="card-actions"><button class="action close" onclick="closeModal()">關閉</button><button class="action done" onclick="closeModal();nextTurn()">完成並換人</button></div></div>`;modal.classList.add('show')}
function rollDice(){const n=1+Math.floor(Math.random()*6),faces=['⚀','⚁','⚂','⚃','⚄','⚅'];state.history.unshift({time:new Date().toLocaleTimeString('zh-TW',{hour:'2-digit',minute:'2-digit'}),kind:'dice',title:`擲出 ${n} 點`,player:state.players[state.turn].name});state.history=state.history.slice(0,50);save();modalBody.innerHTML=`<div class="card dice-result" style="--accent:var(--rail)"><div class="card-type">擲骰結果</div><div class="die">${faces[n-1]}</div><h2>${n} 點</h2>${n>=5?'<div class="branch">🌿 若正好遇到支線入口，可依規則進入支線。</div>':''}<div class="card-actions"><button class="action close" onclick="closeModal()">關閉</button><button class="action done" onclick="closeModal();nextTurn()">完成並換人</button></div></div>`;modal.classList.add('show')}
function nextTurn(){state.turn=(state.turn+1)%state.players.length;save()}
function change(i,key,delta){state.players[i][key]=Math.max(0,state.players[i][key]+delta);save()}
function rename(i,v){state.players[i].name=v.trim()||`玩家 ${i+1}`;save()}
function render(){turnName.textContent=state.players[state.turn].name;playerList.innerHTML=state.players.map((p,i)=>`<div class="player"><div><div class="pname">${i===state.turn?'🚩 ':''}${p.name}</div><div class="stats"><span>💰 ${p.money}</span><span>⭐ ${p.score}</span></div></div><div class="controls"><button class="pill money" onclick="change(${i},'money',-100)">幣 −100</button><button class="pill money" onclick="change(${i},'money',100)">幣 +100</button><button class="pill score" onclick="change(${i},'score',-20)">分 −20</button><button class="pill score" onclick="change(${i},'score',20)">分 +20</button></div></div>`).join('');const sorted=[...state.players].sort((a,b)=>b.score-a.score||b.money-a.money);ranking.innerHTML=sorted.map((p,i)=>`<div class="rank-row"><span>${['🥇','🥈','🥉','4.','5.','6.'][i]} ${p.name}</span><b>⭐ ${p.score}</b></div>`).join('');recent.innerHTML=state.history.length?state.history.slice(0,8).map(h=>`<div class="history-item"><b>${h.player}</b>｜${h.title}<span style="float:right;color:#8da0a3">${h.time}</span></div>`).join(''):'<div class="empty">還沒有紀錄，開始抽卡吧！</div>';nameInputs.innerHTML=state.players.map((p,i)=>`<label>玩家 ${i+1}</label><input value="${p.name.replace(/"/g,'&quot;')}" onchange="rename(${i},this.value)">`).join('')}
function showPage(id,btn){document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));document.getElementById(id).classList.add('active');document.querySelectorAll('.nav').forEach(x=>x.classList.remove('active'));btn.classList.add('active');render()}
function closeModal(){modal.classList.remove('show')}
function backdrop(e){if(e.target===modal)closeModal()}
function resetGame(){if(confirm('確定清除玩家金額、積分、抽牌與紀錄嗎？')){state={players:initialPlayers.map(x=>({...x})),turn:0,decks:{},history:[]};save()}}
render();
</script>
</body>
</html>
