<div class="app">
<header class="hero"><div class="brand"><div class="logo">🚂</div><div><h1>Railopoly</h1><p class="subtitle">台灣鐵路環島大富翁｜三天兩夜版</p></div></div></header>
<main>
<section id="home" class="page active"><div id="permissionBanner" class="permission"></div>
<div class="panel status"><div><div class="turn-label">本輪擲骰玩家</div><div id="turnName" class="turn-name">玩家 1</div><div id="gameMode" class="subtitle" style="margin-top:4px"></div></div><button class="mini" onclick="nextTurn()">換下一位 →</button></div>
<div class="panel status"><div><div class="turn-label">全場共用骰子</div><div id="sharedDiceCount" class="dice-count">🎲 1 顆</div></div><div id="diceAdmin"></div></div><div class="grid">
<button class="big dice" onclick="rollDice()"><span>🎲</span>擲骰子</button>
<button class="big chance" onclick="draw('chance')"><span>🍀</span>機會卡</button>
<button class="big fate" onclick="draw('fate')"><span>🌊</span>命運卡</button>
<button class="big task" onclick="draw('task')"><span>🎯</span>任務卡</button>
</div>
<div class="panel" style="margin-top:14px"><h3 class="section-title">我的命運／機會卡</h3><div id="chanceInventory" class="inventory"></div></div><div class="panel"><h3 class="section-title">最近紀錄</h3><div id="recent" class="history"></div></div>
</section>
<section id="players" class="page"><div class="panel"><h3 class="section-title">六位玩家</h3><div id="playerList" class="players"></div></div><div class="panel"><h3 id="rankTitle" class="section-title">積分排行</h3><div id="ranking" class="rank"></div></div></section>
<section id="roles" class="page"><div id="roleTools"></div></section>
<section id="settings" class="page"><div class="panel settings"><h3 class="section-title">房間</h3><div id="roomInfo"></div><button class="secondary" style="width:100%;margin-top:10px" onclick="leaveRoom()">離開房間</button></div><div class="panel settings"><h3 class="section-title">身分與職位</h3><p class="subtitle">先選擇這支手機目前由哪位玩家使用，再為六位玩家分配六個不同職位。</p><label>這支手機的玩家</label><select id="devicePlayer" onchange="setDevicePlayer(this.value)"></select><div id="roleInputs" class="role-grid"></div></div><div class="panel settings"><h3 class="section-title">玩家名稱</h3><div id="nameInputs"></div></div><div class="panel settings"><h3 class="section-title">主持人管理</h3><div id="hostManagement"></div></div><div class="panel settings"><h3 class="section-title">遊戲管理</h3><p class="subtitle">主持人可開始或重設遊戲。資料會即時同步到 Firebase 雲端；每支手機請在上方選擇自己的玩家身分。</p><button id="startBtn" class="mini" style="width:100%;margin-top:16px;padding:12px" onclick="startOfficialGame()">正式開始三日遊戲</button><button id="resetBtn" class="danger" onclick="resetGame()">清除目前資料並回到測試模式</button></div></section>
</main>
</div>

function closeModal(){modal.classList.remove('show')}
function backdrop(e){if(e.target===modal)closeModal()}
function startOfficialGame(){if(!hasRole('主持人')){alert('只有主持人可以正式開始遊戲。');return}if(confirm('這會清除所有測試紀錄、積分與牌堆，並從今天開始正式三日遊戲。確定開始嗎？')){state={players:state.players.map(p=>({...p,money:5000,score:0,chanceCards:[]})),devicePlayer:state.devicePlayer,turn:0,decks:{},history:[],game:{mode:'official',startedAt:new Date().toISOString(),diceCount:1,stopCount:0,cardSequence:0,rollBonuses:[],taskMultipliers:[]},sharedCard:null,taskRecords:[],grouping:{...state.grouping,active:true,missionActive:false,tempRoles:{},groups:state.grouping.groups.map(g=>({...g,adjustment:0}))},announcements:[],navigator:{station:'',toilet:'',luggage:'',transfer:'',meeting:'',returnTime:'',routeTarget:'',routeMinutes:'',routeNote:'',completed:0},medical:{checks:{water:false,toilet:false,luggage:false,kit:false,sun:false,well:false},statuses:{},reminders:[],completed:0}};save();alert('正式三日遊戲已開始！之後關閉再打開，紀錄仍會保留。')}}
function resetGame(){if(!hasRole('主持人')){alert('只有主持人可以清除遊戲資料。');return}if(confirm('確定清除目前所有資料並回到測試模式嗎？')){state={players:state.players.map(p=>({...p,money:5000,score:0,chanceCards:[]})),devicePlayer:state.devicePlayer,turn:0,decks:{},history:[],game:{mode:'test',startedAt:null,diceCount:1,stopCount:0,cardSequence:0,rollBonuses:[],taskMultipliers:[]},sharedCard:null,taskRecords:[],grouping:{...state.grouping,active:true,missionActive:false,tempRoles:{},groups:state.grouping.groups.map(g=>({...g,adjustment:0}))},announcements:[],navigator:{station:'',toilet:'',luggage:'',transfer:'',meeting:'',returnTime:'',routeTarget:'',routeMinutes:'',routeNote:'',completed:0},medical:{checks:{water:false,toilet:false,luggage:false,kit:false,sun:false,well:false},statuses:{},reminders:[],completed:0}};save()}}
render();
function randomRoomId(){const chars='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';return Array.from({length:6},()=>chars[Math.floor(Math.random()*chars.length)]).join('')}
async function createRoom(){if(!auth.currentUser)return alert('仍在登入 Firebase，請稍候再試。');let code=randomRoomId();while((await db.collection('rooms').doc(code).get()).exists)code=randomRoomId();roomId=code;localStorage.setItem('railopolyRoomId',roomId);roomGate.classList.add('hidden');connectRoom(true)}
function joinRoom(){const code=(document.getElementById('joinRoomCode').value||'').trim().toUpperCase();if(!/^[A-Z2-9]{6}$/.test(code))return alert('請輸入正確的 6 碼房號。');roomId=code;localStorage.setItem('railopolyRoomId',roomId);roomGate.classList.add('hidden');connectRoom(false)}
function leaveRoom(){if(!confirm('確定離開目前房間？'))return;if(roomUnsub)roomUnsub();roomUnsub=null;roomRef=null;roomId='';cloudReady=false;localStorage.removeItem('railopolyRoomId');roomGate.classList.remove('hidden');render()}
async function connectRoom(createIfMissing){
 if(!roomId||!auth.currentUser)return;cloudReady=false;roomRef=db.collection('rooms').doc(roomId);if(roomUnsub)roomUnsub();
 const first=await roomRef.get();if(!first.exists&&!createIfMissing){alert('找不到這個房間。');localStorage.removeItem('railopolyRoomId');roomId='';roomGate.classList.remove('hidden');return}
 if(!first.exists){const cloudState=JSON.parse(JSON.stringify(state));delete cloudState.devicePlayer;await roomRef.set({state:cloudState,createdAt:firebase.firestore.FieldValue.serverTimestamp()})}
 roomUnsub=roomRef.onSnapshot(async snap=>{
  if(!snap.exists)return;
  const data=snap.data();if(data&&data.state){applyingCloud=true;const devicePlayer=Number(localStorage.getItem('railopolyDevicePlayer')||0);state={...structuredClone(defaultState),...data.state,devicePlayer};state.players=state.players.map((p,i)=>({...p,role:p.role||roles[i].name,chanceCards:Array.isArray(p.chanceCards)?p.chanceCards:[]}));if(!state.game.diceCount)state.game.diceCount=1;if(!Array.isArray(state.game.rollBonuses))state.game.rollBonuses=[];if(!Array.isArray(state.game.taskMultipliers))state.game.taskMultipliers=[];if(!state.grouping)state.grouping=structuredClone(defaultState.grouping);if(!Array.isArray(state.taskRecords))state.taskRecords=[];normalizeCardState();localStorage.setItem('railopolyState',JSON.stringify(state));applyingCloud=false;cloudReady=true;render();
   const e=state.sharedCard,seen=localStorage.getItem('railopolySeenCard_'+roomId)||'';if(e&&e.id!==seen){localStorage.setItem('railopolySeenCard_'+roomId,e.id);lastSeenSharedCard=e.id;showSharedCard(e,['chance','fate'].includes(e.type)&&e.drawerIndex===state.devicePlayer&&e.status==='held')}
  }
 },err=>{console.error(err);alert('無法連接 Firestore，請確認規則已發布。')});
}
auth.onAuthStateChanged(async user=>{if(!user){try{await auth.signInAnonymously()}catch(err){console.error(err);alert('匿名登入失敗，請確認 Firebase Authentication 已啟用。')}return}if(roomId){roomGate.classList.add('hidden');connectRoom(false)}else roomGate.classList.remove('hidden')});
</script>

<script>if ('serviceWorker' in navigator) { window.addEventListener('load', () => navigator.serviceWorker.register('./service-worker.js').catch(console.error)); }</script>
