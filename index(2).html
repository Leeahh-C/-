<body>
<div class="app">
<header class="hero"><div class="brand"><div class="logo">🚂</div><div><h1>Railopoly</h1><p class="subtitle">台灣鐵路環島大富翁｜三天兩夜版</p></div></div></header>
<main>
<section id="home" class="page active"><div id="permissionBanner" class="permission"></div>
<div class="panel status"><div><div class="turn-label">本輪擲骰玩家</div><div id="turnName" class="turn-name">玩家 1</div><div id="gameMode" class="subtitle" style="margin-top:4px"></div></div><button class="mini" onclick="nextTurn()">換下一位 →</button></div>
<div class="grid">
<button class="big dice" onclick="rollDice()"><span>🎲</span>擲骰子</button>
<button class="big chance" onclick="draw('chance')"><span>🍀</span>機會卡</button>
<button class="big fate" onclick="draw('fate')"><span>🌊</span>命運卡</button>
<button class="big task" onclick="draw('task')"><span>🎯</span>任務卡</button>
</div>
<div class="panel" style="margin-top:14px"><h3 class="section-title">最近紀錄</h3><div id="recent" class="history"></div></div>
</section>
<section id="players" class="page"><div class="panel"><h3 class="section-title">六位玩家</h3><div id="playerList" class="players"></div></div><div class="panel"><h3 class="section-title">積分排行</h3><div id="ranking" class="rank"></div></div></section>
<section id="roles" class="page"><div id="roleTools"></div></section>
<section id="settings" class="page"><div class="panel settings"><h3 class="section-title">身分與職位</h3><p class="subtitle">先選擇這支手機目前由哪位玩家使用，再為六位玩家分配六個不同職位。</p><label>這支手機的玩家</label><select id="devicePlayer" onchange="setDevicePlayer(this.value)"></select><div id="roleInputs" class="role-grid"></div></div><div class="panel settings"><h3 class="section-title">玩家名稱</h3><div id="nameInputs"></div></div><div class="panel settings"><h3 class="section-title">主持人管理</h3><div id="hostManagement"></div></div><div class="panel settings"><h3 class="section-title">遊戲管理</h3><p class="subtitle">主持人可開始或重設遊戲。資料目前只儲存在這支手機；跨手機即時同步仍需雲端資料庫版本。</p><button id="startBtn" class="mini" style="width:100%;margin-top:16px;padding:12px" onclick="startOfficialGame()">正式開始三日遊戲</button><button id="resetBtn" class="danger" onclick="resetGame()">清除目前資料並回到測試模式</button></div></section>
</main>
</div>
<nav class="bottom"><button class="nav active" data-page="home" onclick="showPage('home',this)"><b>🏠</b>遊戲</button><button class="nav" data-page="players" onclick="showPage('players',this)"><b>👥</b>玩家</button><button class="nav" data-page="roles" onclick="showPage('roles',this)"><b>🧭</b>職務</button><button class="nav" data-page="settings" onclick="showPage('settings',this)"><b>⚙️</b>設定</button></nav>
<div id="modal" class="modal" onclick="backdrop(event)"><div id="modalBody"></div></div>

{name:'總務',icon:'💼',desc:'管理共同旅費；網站中可調整所有玩家的遊戲幣。'},
{name:'雜務',icon:'🧰',desc:'管理遊戲道具、記錄到站與任務；網站中可調整所有玩家積分。'},
{name:'攝影',icon:'📸',desc:'負責拍照、攝影、限時動態與旅程短影音。'},
{name:'導航員',icon:'🧭',desc:'查詢車站資源、任務方向與路線，必要時向路人問路。'},
{name:'後勤醫療',icon:'🩹',desc:'機動支援、攜帶急救用品，提醒補水、休息與行李安全。'}];
const initialPlayers=Array.from({length:6},(_,i)=>({name:`玩家 ${i+1}`,money:5000,score:0,role:roles[i].name}));
let state=JSON.parse(localStorage.getItem('railopolyState')||'null')||{players:initialPlayers,turn:0,decks:{},history:[],game:{mode:'test',startedAt:null},grouping:state.grouping,announcements:[],navigator:{station:'',toilet:'',luggage:'',transfer:'',meeting:'',returnTime:'',routeTarget:'',routeMinutes:'',routeNote:'',completed:0},medical:{checks:{water:false,toilet:false,luggage:false,kit:false,sun:false,well:false},statuses:{},reminders:[],completed:0}};
if(!state.game)state.game={mode:'test',startedAt:null};
if(!state.grouping)state.grouping={active:false,groups:[{name:'主線組',members:[0,1,2]},{name:'支線組',members:[3,4,5]}]};
if(!state.announcements)state.announcements=[];
if(!state.navigator)state.navigator={station:'',toilet:'',luggage:'',transfer:'',meeting:'',returnTime:'',routeTarget:'',routeMinutes:'',routeNote:'',completed:0};
if(!state.medical)state.medical={checks:{water:false,toilet:false,luggage:false,kit:false,sun:false,well:false},statuses:{},reminders:[],completed:0};
if(state.devicePlayer===undefined)state.devicePlayer=0;
state.players=state.players.map((p,i)=>({...p,role:p.role||roles[i].name}));
function currentUser(){return state.players[state.devicePlayer]||state.players[0]}
function hasRole(name){return currentUser().role===name}
function playerGroupIndex(i){return state.grouping.groups.findIndex(g=>g.members.includes(i))}
function canPlay(){return state.turn===state.devicePlayer||hasRole('主持人')}
function save(){localStorage.setItem('railopolyState',JSON.stringify(state));render()}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function ensureDeck(type){if(!state.decks[type]||!state.decks[type].length)state.decks[type]=shuffle(cards[type].map((_,i)=>i))}
function logEntry(kind,title){const now=new Date();let day=1;if(state.game.mode==='official'&&state.game.startedAt){const start=new Date(state.game.startedAt);day=Math.max(1,Math.floor((now-start)/86400000)+1)}state.history.unshift({timestamp:now.toISOString(),date:now.toLocaleDateString('zh-TW'),time:now.toLocaleTimeString('zh-TW',{hour:'2-digit',minute:'2-digit'}),day,kind,title,player:state.players[state.turn].name});state.history=state.history.slice(0,500)}
function draw(type){if(!canPlay()){alert('目前不是你的回合；只有本輪玩家或主持人可以操作。');return}ensureDeck(type);const idx=state.decks[type].pop(),c=cards[type][idx];logEntry(type,c[0]);save();showCard(type,c,idx+1)}
function showCard(type,c,id){const names={chance:'機會卡',fate:'命運卡',task:'任務卡'},colors={chance:'var(--chance)',fate:'var(--fate)',task:'var(--task)'};modalBody.innerHTML=`<div class="card" style="--accent:${colors[type]}"><div class="card-type">${names[type]}</div><div class="card-id">#${String(id).padStart(3,'0')}</div><div class="card-icon">${c[2]}</div><h2>${c[0]}</h2><p>${c[1]}</p><div class="note">由本輪擲骰玩家立即執行；需要存證的任務請拍照或錄影。</div><div class="card-actions"><button class="action close" onclick="closeModal()">關閉</button><button class="action done" onclick="closeModal();nextTurn()">完成並換人</button></div></div>`;modal.classList.add('show')}
function rollDice(){if(!canPlay()){alert('目前不是你的回合；只有本輪玩家或主持人可以操作。');return}const n=1+Math.floor(Math.random()*6),faces=['⚀','⚁','⚂','⚃','⚄','⚅'];logEntry('dice',`擲出 ${n} 點`);save();modalBody.innerHTML=`<div class="card dice-result" style="--accent:var(--rail)"><div class="card-type">擲骰結果</div><div class="die">${faces[n-1]}</div><h2>${n} 點</h2>${n>=5?'<div class="branch">🌿 若正好遇到支線入口，可依規則進入支線。</div>':''}<div class="card-actions"><button class="action close" onclick="closeModal()">關閉</button><button class="action done" onclick="closeModal();nextTurn()">完成並換人</button></div></div>`;modal.classList.add('show')}
function nextTurn(){if(!hasRole('主持人')&&state.turn!==state.devicePlayer){alert('只有本輪玩家或主持人可以換下一位。');return}state.turn=(state.turn+1)%state.players.length;save()}
function change(i,key,delta){
 if(key==='money'&&!hasRole('總務')){alert('只有總務可以調整遊戲幣。');return}
 if(key==='score'&&!hasRole('雜務')){alert('只有雜務可以調整積分。');return}
 state.players[i][key]=Math.max(0,state.players[i][key]+delta);save()
}
function setDevicePlayer(v){state.devicePlayer=Number(v);save()}
function postAnnouncement(){if(!hasRole('主持人'))return alert('只有主持人可以發布公告。');const el=document.getElementById('announcementInput');const text=(el?.value||'').trim();if(!text)return alert('請先輸入公告內容。');state.announcements.unshift({text,time:new Date().toLocaleTimeString('zh-TW',{hour:'2-digit',minute:'2-digit'})});state.announcements=state.announcements.slice(0,20);logEntry('announcement',text);save()}
function toggleGrouping(active){if(!hasRole('主持人'))return alert('只有主持人可以管理分組。');const msg=active?'是否開始分組？分組後各組可獨立行動。':'是否結束分組並匯合？所有玩家將回到同一遊戲流程。';if(confirm(msg)){state.grouping.active=active;logEntry('group',active?'開始分組模式':'結束分組並匯合');save()}}
function movePlayerGroup(i,g){if(!hasRole('主持人'))return alert('只有主持人可以調整分組。');state.grouping.groups.forEach(x=>x.members=x.members.filter(n=>n!==i));state.grouping.groups[g].members.push(i);save()}
function updateNavigator(key,val){if(!hasRole('導航員'))return alert('只有導航員可以操作此功能。');state.navigator[key]=val;save()}
function publishStationInfo(){if(!hasRole('導航員'))return alert('只有導航員可以發布到站情報。');state.navigator.completed++;logEntry('navigator',`更新 ${state.navigator.station||'目前車站'} 到站情報`);save();alert('到站情報已發布。')}
function publishRoute(){if(!hasRole('導航員'))return alert('只有導航員可以發布任務路線。');logEntry('navigator',`發布任務路線：${state.navigator.routeTarget||'未命名目的地'}`);save();alert('任務路線已發布。')}
function toggleMedicalCheck(key,checked){if(!hasRole('後勤醫療'))return alert('只有後勤醫療可以操作此功能。');state.medical.checks[key]=checked;save()}
function completeMedicalCheck(){if(!hasRole('後勤醫療'))return alert('只有後勤醫療可以完成檢查。');const done=Object.values(state.medical.checks).filter(Boolean).length;if(done<6)return alert('請完成全部六項檢查。');state.medical.completed++;logEntry('medical','完成全組出發前安全檢查');save();alert('後勤安全檢查完成。')}
function setOwnStatus(status){state.medical.statuses[state.devicePlayer]=status;logEntry('status',`回報狀態：${status}`);save()}
function sendReminder(text){if(!hasRole('後勤醫療'))return alert('只有後勤醫療可以發送提醒。');state.medical.reminders.unshift({text,time:new Date().toLocaleTimeString('zh-TW',{hour:'2-digit',minute:'2-digit'})});state.medical.reminders=state.medical.reminders.slice(0,20);logEntry('medical',text);save()}
function setRole(i,v){
 const other=state.players.findIndex((p,idx)=>idx!==i&&p.role===v);
 if(other>=0){const old=state.players[i].role;state.players[other].role=old}
 state.players[i].role=v;save()
}
function rename(i,v){state.players[i].name=v.trim()||`玩家 ${i+1}`;save()}
function render(){
 const user=currentUser(), role=roles.find(r=>r.name===user.role)||roles[0];
 turnName.textContent=state.players[state.turn].name;
 gameMode.textContent=state.game.mode==='official'?`正式遊戲｜第 ${Math.max(1,Math.floor((new Date()-new Date(state.game.startedAt))/86400000)+1)} 天`:'測試模式｜測試完成後請按「正式開始三日遊戲」';
 const gi=playerGroupIndex(state.devicePlayer);const groupText=state.grouping.active&&gi>=0?`<div class="group-chip">${state.grouping.groups[gi].name}</div>`:'';permissionBanner.innerHTML=`<b>${role.icon} ${user.name}｜${user.role}</b><br>${role.desc}${groupText}`;
 playerList.innerHTML=state.players.map((p,i)=>`<div class="player"><div><div class="pname">${i===state.turn?'🚩 ':''}${p.name}</div><div class="role-badge">${(roles.find(r=>r.name===p.role)||{}).icon||'👤'} ${p.role}</div>${state.grouping.active?`<div class="group-chip">${state.grouping.groups[playerGroupIndex(i)]?.name||'未分組'}</div>`:''}<div class="stats"><span>💰 ${p.money}</span><span>⭐ ${p.score}</span></div></div><div class="controls"><button class="pill money ${hasRole('總務')?'':'locked'}" onclick="change(${i},'money',-100)">幣 −100</button><button class="pill money ${hasRole('總務')?'':'locked'}" onclick="change(${i},'money',100)">幣 +100</button><button class="pill score ${hasRole('雜務')?'':'locked'}" onclick="change(${i},'score',-20)">分 −20</button><button class="pill score ${hasRole('雜務')?'':'locked'}" onclick="change(${i},'score',20)">分 +20</button></div></div>`).join('');
 const sorted=[...state.players].sort((a,b)=>b.score-a.score||b.money-a.money);
 ranking.innerHTML=sorted.map((p,i)=>`<div class="rank-row"><span>${['🥇','🥈','🥉','4.','5.','6.'][i]} ${p.name}・${p.role}</span><b>⭐ ${p.score}</b></div>`).join('');
 recent.innerHTML=state.history.length?state.history.slice(0,12).map(h=>`<div class="history-item"><b>${h.player}</b>｜${h.title}<div style="font-size:12px;color:#8da0a3;margin-top:3px">${state.game.mode==='official'?'第 '+(h.day||1)+' 天｜':''}${h.date||''} ${h.time||''}</div></div>`).join(''):'<div class="empty">還沒有紀錄，開始抽卡吧！</div>';
 nameInputs.innerHTML=state.players.map((p,i)=>`<label>玩家 ${i+1}</label><input value="${p.name.replace(/"/g,'&quot;')}" onchange="rename(${i},this.value)">`).join('');
 devicePlayer.innerHTML=state.players.map((p,i)=>`<option value="${i}" ${i===state.devicePlayer?'selected':''}>${p.name}｜${p.role}</option>`).join('');
 roleInputs.innerHTML=state.players.map((p,i)=>`<div class="role-row"><div><label>${p.name} 的職位</label><select onchange="setRole(${i},this.value)">${roles.map(r=>`<option value="${r.name}" ${p.role===r.name?'selected':''}>${r.icon} ${r.name}</option>`).join('')}</select><div class="role-desc">${(roles.find(r=>r.name===p.role)||roles[0]).desc}</div></div></div>`).join('');
 const latestAnnouncements=state.announcements.slice(0,3).map(a=>`<div class="announcement"><b>📢 ${a.time}</b><br>${a.text}</div>`).join('');
 const statusOptions=['🟢 正常','🟡 需要休息','🔵 需要補水','🟠 需要廁所','🔴 身體不舒服'];
 let tools=`<div class="panel"><h3 class="section-title">我的職務工具</h3><div class="permission"><b>${role.icon} ${user.role}</b><br>${role.desc}</div>`;
 if(hasRole('導航員'))tools+=`<div class="tool-grid"><div class="tool-card"><h4>🧭 到站情報卡</h4><input class="small-input" placeholder="目前車站" value="${state.navigator.station}" oninput="updateNavigator('station',this.value)"><input class="small-input" placeholder="洗手間位置" value="${state.navigator.toilet}" oninput="updateNavigator('toilet',this.value)"><input class="small-input" placeholder="行李寄放位置" value="${state.navigator.luggage}" oninput="updateNavigator('luggage',this.value)"><input class="small-input" placeholder="轉乘位置" value="${state.navigator.transfer}" oninput="updateNavigator('transfer',this.value)"><input class="small-input" placeholder="集合地點" value="${state.navigator.meeting}" oninput="updateNavigator('meeting',this.value)"><input class="small-input" placeholder="最晚回站時間" value="${state.navigator.returnTime}" oninput="updateNavigator('returnTime',this.value)"><div class="tool-actions"><button class="primary" onclick="publishStationInfo()">發布到站情報</button></div></div><div class="tool-card"><h4>📍 任務路線</h4><input class="small-input" placeholder="目的地" value="${state.navigator.routeTarget}" oninput="updateNavigator('routeTarget',this.value)"><input class="small-input" placeholder="預估步行分鐘" value="${state.navigator.routeMinutes}" oninput="updateNavigator('routeMinutes',this.value)"><input class="small-input" placeholder="注意事項" value="${state.navigator.routeNote}" oninput="updateNavigator('routeNote',this.value)"><div class="tool-actions"><button class="primary" onclick="publishRoute()">發布任務路線</button></div></div></div>`;
 else if(hasRole('後勤醫療')){const labels={water:'全員已補水',toilet:'已確認廁所需求',luggage:'行李已帶齊',kit:'急救包在身上',sun:'已提醒防曬／防蚊',well:'無人身體不適'};tools+=`<div class="tool-card"><h4>🩹 出發前安全檢查</h4><div class="checklist">${Object.entries(labels).map(([k,v])=>`<label class="checkline"><input type="checkbox" ${state.medical.checks[k]?'checked':''} onchange="toggleMedicalCheck('${k}',this.checked)"><span>${v}</span></label>`).join('')}</div><div class="tool-actions"><button class="primary" onclick="completeMedicalCheck()">完成檢查</button></div></div><div class="tool-card"><h4>💧 全組提醒</h4><div class="tool-actions"><button class="secondary" onclick="sendReminder('請全組補水')">補水</button><button class="secondary" onclick="sendReminder('請原地休息 10 分鐘')">休息</button><button class="secondary" onclick="sendReminder('請確認隨身行李')">行李</button><button class="secondary" onclick="sendReminder('請補防曬或防蚊')">防曬／防蚊</button></div></div>`}
 else tools+=`<div class="tool-card">此職位目前沒有專屬操作面板；仍可使用下方的個人狀態回報。</div>`;
 tools+=`<div class="panel" style="box-shadow:none;margin-top:14px"><h4>我的旅行狀態</h4><div class="status-grid">${statusOptions.map(x=>`<button class="status-btn ${state.medical.statuses[state.devicePlayer]===x?'active':''}" onclick="setOwnStatus('${x}')">${x}</button>`).join('')}</div></div></div>`;
 roleTools.innerHTML=tools;
 hostManagement.innerHTML=hasRole('主持人')?`<label>即時公告</label><input id="announcementInput" placeholder="例如：18:30 花蓮站集合"><button class="primary" style="width:100%;margin-top:8px" onclick="postAnnouncement()">發布公告</button><div class="section-divider"></div><h4>分組管理</h4><p class="subtitle">目前：${state.grouping.active?'分組模式':'匯合模式'}</p>${state.players.map((p,i)=>`<label>${p.name}</label><select onchange="movePlayerGroup(${i},Number(this.value))">${state.grouping.groups.map((g,idx)=>`<option value="${idx}" ${g.members.includes(i)?'selected':''}>${g.name}</option>`).join('')}</select>`).join('')}<div class="tool-actions"><button class="primary" onclick="toggleGrouping(true)">開始分組</button><button class="warn" onclick="toggleGrouping(false)">結束分組（匯合）</button></div><div class="section-divider"></div><h4>最新公告</h4>${latestAnnouncements||'<div class="empty">尚無公告</div>'}`:`<div class="empty">只有主持人可以管理公告與分組。</div>`;
 startBtn.classList.toggle('locked',!hasRole('主持人'));resetBtn.classList.toggle('locked',!hasRole('主持人'));
}
function showPage(id,btn){document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));document.getElementById(id).classList.add('active');document.querySelectorAll('.nav').forEach(x=>x.classList.remove('active'));btn.classList.add('active');render()}
function closeModal(){modal.classList.remove('show')}
function backdrop(e){if(e.target===modal)closeModal()}
function startOfficialGame(){if(!hasRole('主持人')){alert('只有主持人可以正式開始遊戲。');return}if(confirm('這會清除所有測試紀錄、積分與牌堆，並從今天開始正式三日遊戲。確定開始嗎？')){state={players:state.players.map(p=>({...p,money:5000,score:0})),devicePlayer:state.devicePlayer,turn:0,decks:{},history:[],game:{mode:'official',startedAt:new Date().toISOString()},grouping:state.grouping,announcements:[],navigator:{station:'',toilet:'',luggage:'',transfer:'',meeting:'',returnTime:'',routeTarget:'',routeMinutes:'',routeNote:'',completed:0},medical:{checks:{water:false,toilet:false,luggage:false,kit:false,sun:false,well:false},statuses:{},reminders:[],completed:0}};save();alert('正式三日遊戲已開始！之後關閉再打開，紀錄仍會保留。')}}
function resetGame(){if(!hasRole('主持人')){alert('只有主持人可以清除遊戲資料。');return}if(confirm('確定清除目前所有資料並回到測試模式嗎？')){state={players:state.players.map(p=>({...p,money:5000,score:0})),devicePlayer:state.devicePlayer,turn:0,decks:{},history:[],game:{mode:'test',startedAt:null},grouping:state.grouping,announcements:[],navigator:{station:'',toilet:'',luggage:'',transfer:'',meeting:'',returnTime:'',routeTarget:'',routeMinutes:'',routeNote:'',completed:0},medical:{checks:{water:false,toilet:false,luggage:false,kit:false,sun:false,well:false},statuses:{},reminders:[],completed:0}};save()}}
render();
</script>
</body>
</html>
